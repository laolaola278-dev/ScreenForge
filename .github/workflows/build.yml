name: Build ScreenForge

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # 必须用 windows-2022（VS2022 + MSVC 19.3x）。
    # windows-latest 的 MSVC 19.51+ 已移除 stdext，与 Qt 6.5.3 不兼容。
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Qt 6.5
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          arch: 'win64_msvc2019_64'

      - name: 下载 FFmpeg dev 包
        shell: pwsh
        run: |
          # 下载 FFmpeg 7.1 dev 包（含 include 头文件 + lib 库）
          curl.exe -L -o ffmpeg-dev.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-lgpl-shared-7.1.zip
          Expand-Archive -Path ffmpeg-dev.zip -DestinationPath ffmpeg-dev -Force
          $ffmpegDir = Get-ChildItem -Path ffmpeg-dev -Directory | Select-Object -First 1
          Write-Host "FFmpeg 解压到: $($ffmpegDir.FullName)"
          # 从 shared 包中提取 include 和 lib（BtbN shared 包包含 include 和 .lib）
          # 设置 FFMPEG_ROOT 环境变量供 CMake 使用
          echo "FFMPEG_ROOT=$($ffmpegDir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: CMake 配置
        run: cmake -B build -DCMAKE_PREFIX_PATH=${{ env.Qt6_DIR }} -DCMAKE_BUILD_TYPE=Release -DFFMPEG_ROOT=${{ env.FFMPEG_ROOT }}

      - name: 编译
        run: cmake --build build --config Release

      - name: 部署 Qt 运行时 + FFmpeg DLL
        shell: pwsh
        # MSVC 多配置生成器把 exe 输出到 build/bin/Release/，自动递归查找
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter ScreenForge.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "未找到 ScreenForge.exe"; exit 1 }
          $outDir = $exe.Directory.FullName
          windeployqt $exe.FullName
          Write-Host "已部署 Qt 运行时: $($outDir)"
          # 复制 FFmpeg DLL
          $ffmpegBin = Join-Path $env:FFMPEG_ROOT "bin"
          if (Test-Path $ffmpegBin) {
              Copy-Item -Path (Join-Path $ffmpegBin "*.dll") -Destination $outDir -Force
              Write-Host "已复制 FFmpeg DLL 到 $($outDir)"
          } else {
              Write-Warning "FFmpeg bin 目录不存在: $($ffmpegBin)"
          }

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ScreenForge-win64
          path: build/bin/
